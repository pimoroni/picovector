name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    name: Host tests (${{ matrix.compiler }})
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        include:
        - compiler: gcc
          cc: gcc
          cxx: g++
        - compiler: clang
          cc: clang
          cxx: clang++

    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}

    steps:
    - uses: actions/checkout@v5

    - name: Configure
      run: cmake -S tests -B build/tests -DCMAKE_BUILD_TYPE=Release

    # The test build is -Wall -Wextra -Werror. Both compilers are run because
    # they disagree about what is worth warning on, and the firmware toolchain is
    # GCC while a lot of local work happens under clang.
    - name: Build
      run: cmake --build build/tests --parallel

    - name: Test
      run: ./build/tests/pv_tests

  sanitizers:
    name: Host tests (address + undefined)
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v5

    # The rasteriser carves fixed buffers out of one shared pool and the blit
    # paths do their own bounds arithmetic, so an overrun is the failure mode
    # worth spending a job on - it is what shipped in blit_hspan.
    - name: Configure
      run: >
        cmake -S tests -B build/asan -DCMAKE_BUILD_TYPE=Debug
        -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all"

    - name: Build
      run: cmake --build build/asan --parallel

    # LeakSanitizer comes on with ASan on Linux (it does not exist on macOS, so
    # this is invisible locally). It reports every shape the tests build: the
    # factories hand back `new(PV_MALLOC(...)) shape_t`, which the firmware's
    # tracing GC reclaims and the host build simply does not. Those are not the
    # failure mode this job is for, and freeing several hundred of them by hand
    # would fight the allocator model rather than test it.
    #
    # Buffers the API hands ownership of *are* still freed by the tests - see
    # free_parsed_blocks() in test_font.cpp and PV_FREE in test_robustness.cpp.
    - name: Test
      run: ASAN_OPTIONS=detect_leaks=0 ./build/asan/pv_tests
